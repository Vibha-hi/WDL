<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- Plot A -->
  <rect x="10" y="10" width="180" height="380" fill="#a5d6a7" stroke="#2e7d32" stroke-width="4"/>
  <text x="100" y="200" font-family="sans-serif" font-size="26" fill="#1b5e20" text-anchor="middle" font-weight="bold">PLOT A</text>
  <text x="100" y="230" font-family="sans-serif" font-size="14" fill="#2e7d32" text-anchor="middle">Sugarcane (Germination)</text>

  <!-- Plot B -->
  <rect x="210" y="10" width="180" height="380" fill="#81c784" stroke="#2e7d32" stroke-width="4"/>
  <text x="300" y="200" font-family="sans-serif" font-size="26" fill="#1b5e20" text-anchor="middle" font-weight="bold">PLOT B</text>
  <text x="300" y="230" font-family="sans-serif" font-size="14" fill="#2e7d32" text-anchor="middle">Sugarcane (Grand Growth)</text>

  <!-- Plot C -->
  <rect x="410" y="10" width="180" height="380" fill="#66bb6a" stroke="#2e7d32" stroke-width="4"/>
  <text x="500" y="200" font-family="sans-serif" font-size="26" fill="#1b5e20" text-anchor="middle" font-weight="bold">PLOT C</text>
  <text x="500" y="230" font-family="sans-serif" font-size="14" fill="#2e7d32" text-anchor="middle">Sugarcane (Maturity)</text>
</svg>
